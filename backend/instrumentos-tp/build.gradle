plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.emiliano'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' //JPA

    implementation 'com.mercadopago:sdk-java:2.2.0'
//Mercado Pago

    implementation("org.apache.poi:poi-ooxml:5.2.3")//EXCEL

    implementation 'com.github.librepdf:openpdf:1.3.30'//PDF

    implementation 'org.springframework.boot:spring-boot-starter-web' //JAVA WEB

    compileOnly 'org.projectlombok:lombok' //LOMBOK
    annotationProcessor 'org.projectlombok:lombok' //LOMBOK

    implementation 'org.mapstruct:mapstruct:1.5.5.Final' // MapStruct
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'// MapStruct

    developmentOnly 'org.springframework.boot:spring-boot-devtools' // Spring Dev Tools
    runtimeOnly 'com.mysql:mysql-connector-j' //MYSQL Connector

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
}
